<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>全景图查看器</title>
<style>
:root {
  --accent: #4fc3f7;
  --bg-toolbar: rgba(20, 20, 22, 0.72);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

#canvas-container {
  position: fixed; inset: 0; z-index: 1;
}
#canvas-container canvas { display: block; touch-action: none; }

/* loading overlay */
#loading {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 14px;
  pointer-events: none; transition: opacity 0.4s;
}
#loading.hidden { opacity: 0; }
.spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(255,255,255,0.18);
  border-top-color: rgba(255,255,255,0.85);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-text {
  color: rgba(255,255,255,0.85); font-size: 15px; letter-spacing: 0.02em; text-align: center;
}
#loading-progress {
  width: 200px; height: 3px; background: rgba(255,255,255,0.12);
  border-radius: 3px; overflow: hidden; display: none;
}
#loading-progress.show { display: block; }
#loading-progress-bar {
  height: 100%; background: var(--accent); border-radius: 3px;
  width: 0%; transition: width 0.3s;
}

/* hint */
#hint {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 30; pointer-events: none;
  color: rgba(255,255,255,0.45); font-size: 14px;
  transition: opacity 0.6s;
}
#hint.faded { opacity: 0; }

/* top bar */
#top-bar {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 50; display: flex; gap: 10px; align-items: center;
}
#title {
  color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 500;
  background: var(--bg-toolbar); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 7px 18px; border-radius: 20px;
}
#reset-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg-toolbar); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
#reset-btn:hover { background: rgba(255,255,255,0.2); }
#reset-btn svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.8); fill: none; stroke-width: 2; }

/* bottom toolbar */
#toolbar {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  z-index: 50; display: flex; gap: 14px; align-items: center;
  background: var(--bg-toolbar); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 18px; padding: 12px 18px;
  border: 1px solid rgba(255,255,255,0.08);
}
.slot {
  width: 80px; height: 80px; border-radius: 12px;
  cursor: pointer; position: relative; overflow: hidden;
  border: 2px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.04);
  transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
  flex-shrink: 0;
}
.slot:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.45); }
.slot.active {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(79,195,247,0.35), inset 0 0 0 1px rgba(79,195,247,0.15);
}
.slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot .upload-icon {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 32px; color: rgba(255,255,255,0.5); font-weight: 300; line-height: 1;
  transition: color 0.2s;
}
.slot:hover .upload-icon { color: rgba(255,255,255,0.8); }
.slot .label {
  position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 10px; background: rgba(0,0,0,0.55);
  padding: 2px 8px; border-radius: 4px; white-space: nowrap;
  pointer-events: none;
}
.slot.fixed-badge::after {
  content: "固定"; position: absolute; top: 5px; right: 5px;
  background: var(--accent); color: #111; font-size: 9px;
  padding: 1px 6px; border-radius: 3px; font-weight: 600; letter-spacing: 0.03em;
}
.slot .delete-btn {
  position: absolute; top: 5px; right: 5px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.6); border: none; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; line-height: 1;
}
.slot.uploaded .delete-btn { display: flex; }
.slot.uploaded:hover .delete-btn { display: flex; }
.slot.fixed-badge .delete-btn { display: none !important; }

#file-input { display: none; }

/* error banner */
#error-banner {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 200; background: rgba(220,40,40,0.85); color: #fff;
  padding: 10px 24px; border-radius: 8px; font-size: 13px;
  display: none; backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  max-width: 90vw; text-align: center;
}
#error-banner.show { display: block; }

/* responsive */
@media (max-width: 500px) {
  #toolbar { gap: 10px; padding: 10px 14px; border-radius: 14px; }
  .slot { width: 64px; height: 64px; border-radius: 10px; }
  #title { font-size: 12px; padding: 6px 14px; }
  #hint { font-size: 12px; }
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="loading">
  <div class="spinner"></div>
  <span id="loading-text">加载全景图中...</span>
  <div id="loading-progress"><div id="loading-progress-bar"></div></div>
</div>

<div id="hint">拖拽鼠标 查看四周 · 滚轮缩放</div>

<div id="error-banner"></div>

<div id="top-bar">
  <span id="title">全景图查看器</span>
  <button id="reset-btn" title="重置视角">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </button>
</div>

<div id="toolbar">
  <div class="slot fixed-badge active" data-index="0" id="slot-0">
    <img src="TP/dji_fly_20260429_190006_0003_1777464777723_pano.jpg" alt="固定全景">
    <span class="label">全景 1</span>
  </div>
  <div class="slot" data-index="1" id="slot-1">
    <span class="upload-icon">+</span>
    <span class="label">上传全景</span>
    <button class="delete-btn" title="移除">×</button>
  </div>
  <div class="slot" data-index="2" id="slot-2">
    <span class="upload-icon">+</span>
    <span class="label">上传全景</span>
    <button class="delete-btn" title="移除">×</button>
  </div>
</div>

<input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/bmp">

<!-- Three.js with CDN fallback -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.write('<script src="https://unpkg.com/three@0.160.0/build/three.min.js"><\/script>');
}
</script>

<script>
(function () {
  /* ---- DOM refs ---- */
  var container = document.getElementById("canvas-container");
  var loadingEl = document.getElementById("loading");
  var loadingText = document.getElementById("loading-text");
  var loadingProgress = document.getElementById("loading-progress");
  var loadingProgressBar = document.getElementById("loading-progress-bar");
  var hintEl = document.getElementById("hint");
  var errorBanner = document.getElementById("error-banner");
  var fileInput = document.getElementById("file-input");

  /* ---- error display ---- */
  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add("show");
    setTimeout(function () { errorBanner.classList.remove("show"); }, 4000);
  }

  /* ---- WebGL check ---- */
  var hasWebGL = !!(window.WebGLRenderingContext || window.WebGL2RenderingContext);
  if (!hasWebGL) {
    loadingText.textContent = "您的浏览器不支持 WebGL\n请使用 Chrome、Edge 或 Firefox 打开";
    document.querySelector(".spinner").style.display = "none";
    return;
  }

  /* ---- Three.js check ---- */
  if (typeof THREE === "undefined") {
    loadingText.textContent = "无法加载 3D 引擎\n请检查网络连接后刷新页面";
    document.querySelector(".spinner").style.display = "none";
    return;
  }

  /* ---- Three.js setup ---- */
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 1200);
  camera.position.set(0, 0, 0);
  camera.rotation.order = "YXZ";

  /* sphere */
  var sphereGeo = new THREE.SphereGeometry(500, 128, 64);
  var sphereMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide });
  var sphere = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(sphere);

  /* ---- state ---- */
  var imageSources = [
    "TP/dji_fly_20260429_190006_0003_1777464777723_pano.jpg",
    null,
    null,
  ];
  var textures = [null, null, null];
  var slotsLoaded = [false, false, false];
  var activeIndex = 0;
  var pendingUploadIndex = -1;
  var initialLoadDone = false;

  var yaw = 0;
  var pitch = 0;
  var fov = 70;
  var isDragging = false;
  var prevPointer = { x: 0, y: 0 };
  var pinchStartDist = 0;
  var pinchStartFov = 70;

  /* ---- loading helpers ---- */
  function showLoading(text, showProgress) {
    loadingText.textContent = text || "加载全景图中...";
    if (showProgress && !initialLoadDone) {
      loadingProgress.classList.add("show");
      loadingProgressBar.style.width = "0%";
    } else {
      loadingProgress.classList.remove("show");
    }
    loadingEl.classList.remove("hidden");
  }
  function hideLoading() {
    loadingEl.classList.add("hidden");
    loadingProgress.classList.remove("show");
  }
  function updateProgress(pct) {
    if (loadingProgress.classList.contains("show")) {
      loadingProgressBar.style.width = Math.min(100, Math.round(pct)) + "%";
    }
  }

  /* ---- hint ---- */
  function hideHint() {
    if (!hintEl.classList.contains("faded")) {
      hintEl.classList.add("faded");
    }
  }

  /* ---- camera ---- */
  function updateCamera() {
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    camera.fov = fov;
    camera.updateProjectionMatrix();
  }

  function resetView() {
    yaw = 0;
    pitch = 0;
    fov = 70;
    updateCamera();
  }

  /* ---- texture management ---- */
  function disposeTexture(index) {
    if (textures[index]) {
      textures[index].dispose();
      textures[index] = null;
    }
  }

  var texLoader = new THREE.TextureLoader();
  function loadTexture(index, source) {
    if (!source) return;
    showLoading(index === 0 ? "加载固定全景图..." : "加载上传的全景图...", source.length > 500000);
    disposeTexture(index);

    texLoader.load(
      source,
      function (tex) {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = true;
        textures[index] = tex;
        slotsLoaded[index] = true;
        if (index === activeIndex) {
          sphere.material.map = tex;
          sphere.material.needsUpdate = true;
        }
        if (index === 0) initialLoadDone = true;
        hideLoading();
      },
      function (xhr) {
        if (xhr.total > 0) {
          updateProgress((xhr.loaded / xhr.total) * 100);
        }
      },
      function (err) {
        hideLoading();
        slotsLoaded[index] = false;
        textures[index] = null;
        if (index === 0) {
          loadingText.textContent = "固定全景图加载失败\n请检查网络后刷新页面";
          document.querySelector(".spinner").style.display = "none";
        } else {
          showError("图片加载失败，请检查文件格式后重试");
          resetSlotUI(index);
        }
      }
    );
  }

  /* ---- slot switching ---- */
  function switchToSlot(index) {
    if (activeIndex === index && textures[index]) return;
    activeIndex = index;
    document.querySelectorAll(".slot").forEach(function (s) { s.classList.remove("active"); });
    var slotEl = document.getElementById("slot-" + index);
    if (slotEl) slotEl.classList.add("active");

    if (textures[index]) {
      sphere.material.map = textures[index];
      sphere.material.needsUpdate = true;
    } else if (imageSources[index]) {
      loadTexture(index, imageSources[index]);
    }
  }

  /* ---- slot UI helpers ---- */
  function resetSlotUI(index) {
    var s = document.getElementById("slot-" + index);
    var existingImg = s.querySelector("img");
    if (existingImg) existingImg.remove();
    if (!s.querySelector(".upload-icon")) {
      var icon = document.createElement("span");
      icon.className = "upload-icon";
      icon.textContent = "+";
      s.insertBefore(icon, s.firstChild);
    }
    s.querySelector(".label").textContent = "上传全景";
    s.classList.remove("uploaded");
  }

  /* ---- upload ---- */
  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) {
      showError("请选择有效的图片文件");
      return;
    }
    if (file.size > 200 * 1024 * 1024) {
      showError("图片文件过大（最大 200MB）");
      return;
    }

    var idx = pendingUploadIndex;
    if (idx < 0 || idx > 2) return;

    var reader = new FileReader();
    reader.onload = function (ev) {
      var dataUrl = ev.target.result;
      imageSources[idx] = dataUrl;

      /* update slot UI */
      var slotEl = document.getElementById("slot-" + idx);
      var existingImg = slotEl.querySelector("img");
      if (existingImg) existingImg.remove();
      var img = document.createElement("img");
      img.src = dataUrl;
      var uploadIcon = slotEl.querySelector(".upload-icon");
      if (uploadIcon) uploadIcon.remove();
      slotEl.insertBefore(img, slotEl.firstChild);
      slotEl.querySelector(".label").textContent = "全景 " + (idx + 1);
      slotEl.classList.add("uploaded");

      /* load into Three.js */
      loadTexture(idx, dataUrl);
      switchToSlot(idx);
    };
    reader.onerror = function () {
      showError("文件读取失败，请重试");
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener("change", function () {
    if (fileInput.files.length > 0) {
      handleFile(fileInput.files[0]);
      fileInput.value = "";
    }
  });

  /* ---- slot click handlers ---- */
  document.querySelectorAll(".slot").forEach(function (slot) {
    slot.addEventListener("click", function (e) {
      if (e.target.classList.contains("delete-btn")) return;
      var index = parseInt(slot.dataset.index, 10);
      if (slotsLoaded[index]) {
        switchToSlot(index);
      } else {
        pendingUploadIndex = index;
        fileInput.click();
      }
    });

    var delBtn = slot.querySelector(".delete-btn");
    if (delBtn) {
      delBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var index = parseInt(slot.dataset.index, 10);
        if (index === 0) return;
        disposeTexture(index);
        imageSources[index] = null;
        slotsLoaded[index] = false;
        resetSlotUI(index);
        if (activeIndex === index) {
          switchToSlot(0);
        }
      });
    }
  });

  /* ---- controls: mouse ---- */
  renderer.domElement.addEventListener("mousedown", function (e) {
    isDragging = true;
    prevPointer.x = e.clientX;
    prevPointer.y = e.clientY;
    hideHint();
  });

  window.addEventListener("mousemove", function (e) {
    if (!isDragging) return;
    var dx = e.clientX - prevPointer.x;
    var dy = e.clientY - prevPointer.y;
    yaw -= dx * 0.003;
    pitch -= dy * 0.003;
    pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, pitch));
    prevPointer.x = e.clientX;
    prevPointer.y = e.clientY;
    updateCamera();
  });

  window.addEventListener("mouseup", function () { isDragging = false; });

  /* wheel zoom */
  renderer.domElement.addEventListener("wheel", function (e) {
    e.preventDefault();
    fov += e.deltaY * 0.04;
    fov = Math.max(15, Math.min(120, fov));
    updateCamera();
    hideHint();
  }, { passive: false });

  /* ---- controls: touch ---- */
  renderer.domElement.addEventListener("touchstart", function (e) {
    e.preventDefault();
    hideHint();
    if (e.touches.length === 1) {
      isDragging = true;
      prevPointer.x = e.touches[0].clientX;
      prevPointer.y = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartFov = fov;
    }
  }, { passive: false });

  renderer.domElement.addEventListener("touchmove", function (e) {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      var dx = e.touches[0].clientX - prevPointer.x;
      var dy = e.touches[0].clientY - prevPointer.y;
      yaw -= dx * 0.003;
      pitch -= dy * 0.003;
      pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, pitch));
      prevPointer.x = e.touches[0].clientX;
      prevPointer.y = e.touches[0].clientY;
      updateCamera();
    } else if (e.touches.length === 2) {
      var dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (pinchStartDist > 0) {
        var scale = pinchStartDist / dist;
        fov = Math.max(15, Math.min(120, pinchStartFov * scale));
        updateCamera();
      }
    }
  }, { passive: false });

  renderer.domElement.addEventListener("touchend", function () { isDragging = false; });
  renderer.domElement.addEventListener("touchcancel", function () { isDragging = false; });

  /* ---- controls: keyboard ---- */
  window.addEventListener("keydown", function (e) {
    /* ignore when typing in inputs */
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    var speed = 0.04;
    var handled = true;
    switch (e.key) {
      case "ArrowLeft":  yaw -= speed; break;
      case "ArrowRight": yaw += speed; break;
      case "ArrowUp":    pitch += speed; break;
      case "ArrowDown":  pitch -= speed; break;
      case "r": case "R": resetView(); break;
      default: handled = false;
    }
    if (handled) {
      pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, pitch));
      updateCamera();
      hideHint();
    }
  });

  /* ---- reset button ---- */
  document.getElementById("reset-btn").addEventListener("click", resetView);

  /* ---- resize ---- */
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---- WebGL context loss ---- */
  renderer.domElement.addEventListener("webglcontextlost", function (e) {
    e.preventDefault();
  }, false);

  renderer.domElement.addEventListener("webglcontextrestored", function () {
    /* re-apply current texture */
    if (textures[activeIndex]) {
      sphere.material.map = textures[activeIndex];
      sphere.material.needsUpdate = true;
    }
  }, false);

  /* ---- render loop ---- */
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  /* ---- initial load ---- */
  loadTexture(0, imageSources[0]);
})();
</script>

</body>
</html>
